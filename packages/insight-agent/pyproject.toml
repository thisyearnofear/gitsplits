[project]
name = "gitsplits-insight-agent"
version = "0.1.0"
description = "LangChain-powered repo insight agent that wraps the GitSplits controller and produces structured recommendations for UiPath Maestro."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langchain-anthropic>=0.3",
  "langchain-openai>=0.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
